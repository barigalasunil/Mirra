name: Build Mirra

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: mirrordesk/package-lock.json

      - name: Install dependencies
        run: cd mirrordesk && npm ci

      - name: Build
        run: cd mirrordesk && npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mirra-windows
          path: |
            mirrordesk/release/*.exe
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: mirrordesk/release/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
