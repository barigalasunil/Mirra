name: Build and Release Mirra

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      flavour:
        description: 'Which build to run'
        required: true
        default: 'all'
        type: choice
        options: [all, combined, android, ios]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mirrordesk/package-lock.json

      - name: Download scrcpy resources
        working-directory: mirrordesk
        run: powershell -ExecutionPolicy Bypass -File download.ps1

      - name: Install dependencies
        working-directory: mirrordesk
        run: npm ci

      - name: Compile TypeScript (main)
        working-directory: mirrordesk
        run: npx tsc -p tsconfig.main.json

      - name: Compile TypeScript (renderer types)
        working-directory: mirrordesk
        run: npx tsc -b

      - name: Build renderer (Vite)
        working-directory: mirrordesk
        run: npx vite build

      - name: Build Combined (Android + iOS)
        working-directory: mirrordesk
        run: npx electron-builder --config electron-builder.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mirra-combined
          path: mirrordesk/release/combined/*.exe
          if-no-files-found: error

      - name: Delete existing release if present
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        run: gh release delete "${{ github.ref_name }}" --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Mirra ${{ github.ref_name }}"
          body: |
            ## Mirra ${{ github.ref_name }}

            | File | Platform |
            |------|----------|
            | `Mirra-*-portable.exe` | Android + iOS |
            | `Mirra-*-setup.exe` | Android + iOS (installer) |

            ### Requirements
            - Windows 10/11 64-bit
            - **Android**: USB Debugging enabled
            - **iOS**: iPhone and PC on same Wi-Fi, iTunes installed, Screen Mirroring → Mirra
          files: mirrordesk/release/combined/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
