appId: com.mirra.app
productName: Mirra
copyright: "Copyright © 2026 Mirra"

directories:
  output: release/combined

files:
  - dist-main/**/*
  - dist/**/*
  - package.json

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: resources/scrcpy/icon.png
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Mirra
  artifactName: "Mirra-${version}-setup.exe"

portable:
  artifactName: "Mirra-${version}-portable.exe"

extraResources:
  - from: resources/scrcpy
    to: scrcpy
  - from: resources/ios
    to: ios
    filter:
      - "**/*"
      - "!.venv/**"

asarUnpack:
  - "**/*.node"
  - "resources/**"
