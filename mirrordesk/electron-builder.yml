appId: com.mirrordesk.app
productName: MirrorDesk
directories:
  output: release
files:
  - dist-main/**/*
  - dist/**/*
  - package.json
extraResources:
  - from: resources/scrcpy
    to: scrcpy
win:
  target: nsis
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
