appId: com.mirra.ios
productName: "Mirra iOS"
copyright: "Copyright © 2026 Mirra"

directories:
  output: release/ios

files:
  - dist-main/**/*
  - dist/**/*
  - package.json

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: resources/scrcpy/icon.png
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: "Mirra iOS"
  artifactName: "Mirra-iOS-${version}-setup.exe"

portable:
  artifactName: "Mirra-iOS-${version}-portable.exe"

extraResources:
  - from: resources/ios
    to: ios

asarUnpack:
  - "**/*.node"
  - "resources/**"
