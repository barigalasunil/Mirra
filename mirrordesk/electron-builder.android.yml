appId: com.mirra.android
productName: "Mirra Android"
copyright: "Copyright © 2026 Mirra"

directories:
  output: release/android

files:
  - dist-main/**/*
  - dist/**/*
  - package.json

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: resources/scrcpy/icon.png
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: "Mirra Android"
  artifactName: "Mirra-Android-${version}-setup.exe"

portable:
  artifactName: "Mirra-Android-${version}-portable.exe"

extraResources:
  - from: resources/scrcpy
    to: scrcpy

asarUnpack:
  - "**/*.node"
  - "resources/**"
